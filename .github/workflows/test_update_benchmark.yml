# Update the test benchmark for all discovered test folders every week on Monday at 00:00 UTC.

name: Update Test Benchmark (Weekly)

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC

permissions:
  contents: write

jobs:
  update-benchmark:
    runs-on: ubuntu-latest
    env:
      UV_EXTRA_INDEX_URL: "https://${{ secrets.QTNM_ARTIF_SW_READ_USER }}:${{ secrets.QTNM_ARTIF_SW_READ_TOKEN }}@quantinuumsw.jfrog.io/artifactory/api/pypi/pypi_local/simple"
      UV_FROZEN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Update benchmark for all discovered test folders
        run: |
          uv run python .github/scripts/discover_test_matrix.py --update-whole
