name: Test Suite (Parallel)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      test-folders: ${{ steps.set-matrix.outputs.test-folders }}
      benchmark-updated: ${{ steps.set-matrix.outputs.benchmark-updated }}
    env:
      UV_EXTRA_INDEX_URL: "https://${{ secrets.QTNM_ARTIF_SW_READ_USER }}:${{ secrets.QTNM_ARTIF_SW_READ_TOKEN }}@quantinuumsw.jfrog.io/artifactory/api/pypi/pypi_local/simple"
      UV_FROZEN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HUGRBOT_PAT || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Discover test folders
        id: set-matrix
        run: |
          uv run python .github/scripts/discover_test_matrix.py

  test:
    needs: discover-tests
    if: needs.discover-tests.outputs.benchmark-updated != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-folder: ${{ fromJson(needs.discover-tests.outputs.test-folders) }}
    uses: ./.github/workflows/test-folder.yml
    with:
      test-folder: ${{ matrix.test-folder }}
      python-version: '3.13'
    secrets: inherit
