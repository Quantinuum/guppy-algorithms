name: Test folder

on:
  workflow_call:
    inputs:
      test-path:
        description: Test directory or file relative to the repository root
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ inputs.python-version }} / ${{ inputs.test-path }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_LOCKED: "1"
      TEST_PATH: ${{ inputs.test-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.3"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -n 4 -v --tb=short -- "$TEST_PATH"
