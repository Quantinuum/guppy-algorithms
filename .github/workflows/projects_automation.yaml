name: Sync issue status from PR state

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - converted_to_draft
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  update-linked-issue-status:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'hugrbot' }}
    runs-on: ubuntu-latest

    steps:
      - name: Decide target status
        id: status
        run: |
          case "${{ github.event.action }}" in
            opened|reopened|edited)
              if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
                echo "value=In Progress" >> "$GITHUB_OUTPUT"
              else
                echo "value=Code Review" >> "$GITHUB_OUTPUT"
              fi
              ;;
            converted_to_draft)
              echo "value=In Progress" >> "$GITHUB_OUTPUT"
              ;;
            ready_for_review)
              echo "value=Code Review" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Find linked issue from PR
        id: linked_issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        title
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number
            });

            const issues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (!issues.length) {
              core.setFailed(
                "No linked issue found. Add a closing keyword like 'Closes #123' to the PR description."
              );
              return;
            }

            if (issues.length > 1) {
              core.setFailed(
                `Multiple closing issues found (${issues.map((issue) => `#${issue.number}`).join(", ")}). Reference exactly one closing issue so the project status update is unambiguous.`
              );
              return;
            }
            core.setOutput("content_id", issues[0].id);

      - name: Update issue Status field in Project
        uses: github/update-project-action@v4
        with:
          github_token: ${{ secrets.PROJECT_TOKEN }}
          organization: ${{ vars.PROJECT_OWNER }}
          project_number: ${{ vars.PROJECT_NUMBER }}
          content_id: ${{ steps.linked_issue.outputs.content_id }}
          field: Status
          value: ${{ steps.status.outputs.value }}
