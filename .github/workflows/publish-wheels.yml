name: Build and publish python wheels


on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build-publish:
    name: Build and publish wheels
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/0.3.4/install.sh | sh
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Build sdist and wheels
        run: |
          uvx --from build pyproject-build --installer uv --outdir dist

      - name: Upload the built packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-guppyalgos-sdist
          path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Report tag
        if: ${{ (github.event_name == 'release' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "Publishing to guppyalgos..."
          echo "Based on the following workflow variables, this is a new version tag push:"
          echo "  - event_name: ${{ github.event_name }}"
          echo "  - ref_type: ${{ github.ref_type }}"
          echo "  - ref: ${{ github.ref }}"

      - name: Install twine
        run: python -m pip install twine

      - name: Publish package distributions to artifactory
        if: ${{ (github.event_name == 'release' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          twine upload --verbose --non-interactive dist/*.whl
        env:
          TWINE_REPOSITORY_URL: "https://quantinuumsw.jfrog.io/artifactory/api/pypi/pypi_local/"
          TWINE_USERNAME: ${{ secrets.QTNM_ARTIF_SW_WRITE_USER }}
          TWINE_PASSWORD: ${{ secrets.QTNM_ARTIF_SW_WRITE_TOKEN }}
